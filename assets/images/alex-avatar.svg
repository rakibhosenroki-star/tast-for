<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Deep Gradient Background -->
    <radialGradient id="cyber-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121D38"/>
      <stop offset="60%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#03060C"/>
    </radialGradient>
    
    <!-- Neon Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="visor-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="400" height="400" fill="url(#cyber-bg)"/>

  <!-- High-Tech Cyber Target Reticle & Coordinate Circles -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1.5" stroke-dasharray="6 8"/>
  <circle cx="200" cy="180" r="115" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="2" stroke-dasharray="14 10"/>
  <circle cx="200" cy="180" r="90" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1"/>

  <!-- Target Crosshairs -->
  <line x1="200" y1="20" x2="200" y2="70" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="290" x2="200" y2="340" stroke="#00F0FF" stroke-width="2" opacity="0.6"/>
  <line x1="40" y1="180" x2="90" y2="180" stroke="#A855F7" stroke-width="2" opacity="0.6"/>
  <line x1="310" y1="180" x2="360" y2="180" stroke="#A855F7" stroke-width="2" opacity="0.6"/>

  <!-- Shoulders / Cyber Armor Exosuit -->
  <path d="M 70 390 C 85 305, 140 275, 200 275 C 260 275, 315 305, 330 390 Z" fill="#0A1124" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2"/>
  <path d="M 120 290 L 200 350 L 280 290" fill="none" stroke="#3B82F6" stroke-width="2.5" opacity="0.8"/>

  <!-- Exosuit LED Strips -->
  <line x1="145" y1="315" x2="165" y2="390" stroke="#A855F7" stroke-width="3" filter="url(#neon-glow)"/>
  <line x1="255" y1="315" x2="235" y2="390" stroke="#00F0FF" stroke-width="3" filter="url(#neon-glow)"/>

  <!-- High-Tech Cyber Collar -->
  <polygon points="170,235 230,235 240,285 160,285" fill="#141E38" stroke="#00F0FF" stroke-width="1.5"/>
  <circle cx="180" cy="260" r="3.5" fill="#00F0FF" filter="url(#neon-glow)"/>
  <circle cx="220" cy="260" r="3.5" fill="#A855F7" filter="url(#neon-glow)"/>
  <line x1="190" y1="270" x2="210" y2="270" stroke="#00F0FF" stroke-width="2"/>

  <!-- Head Base -->
  <path d="M 145 175 C 145 110, 168 85, 200 85 C 232 85, 255 110, 255 175 C 255 228, 230 248, 200 248 C 170 248, 145 228, 145 175 Z" fill="#16223D" stroke="#00F0FF" stroke-width="1.8"/>

  <!-- Cyberpunk Hair / Neon Strands -->
  <path d="M 130 150 C 125 80, 165 55, 200 55 C 245 55, 275 75, 270 140 C 255 105, 240 85, 200 85 C 160 85, 140 110, 130 150 Z" fill="#7C3AED"/>
  <!-- Glowing Hair Highlights -->
  <path d="M 155 75 C 185 60, 225 62, 255 82" fill="none" stroke="#00F0FF" stroke-width="3" filter="url(#neon-glow)"/>
  <path d="M 175 62 C 200 52, 235 56, 260 72" fill="none" stroke="#EC4899" stroke-width="2" filter="url(#neon-glow)"/>

  <!-- Augmented Cyber Visor / Smart Optics -->
  <polygon points="135,148 265,148 255,192 145,192" fill="rgba(0, 240, 255, 0.35)" stroke="#00F0FF" stroke-width="2.5" filter="url(#visor-bloom)"/>
  
  <!-- Visor HUD Scan Lines & Data Streams -->
  <line x1="150" y1="160" x2="250" y2="160" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9"/>
  <line x1="155" y1="172" x2="230" y2="172" stroke="#00F0FF" stroke-width="1.5" opacity="0.85"/>
  <circle cx="242" cy="172" r="3" fill="#EC4899" filter="url(#neon-glow)"/>
  <circle cx="230" cy="182" r="2" fill="#00F0FF"/>
  <line x1="160" y1="182" x2="215" y2="182" stroke="#A855F7" stroke-width="1.2"/>

  <!-- Cyber Neural Interface Pods (Ears) -->
  <rect x="127" y="148" width="14" height="32" rx="5" fill="#070D1B" stroke="#A855F7" stroke-width="2"/>
  <circle cx="134" cy="164" r="3" fill="#A855F7" filter="url(#neon-glow)"/>

  <rect x="259" y="148" width="14" height="32" rx="5" fill="#070D1B" stroke="#00F0FF" stroke-width="2"/>
  <circle cx="266" cy="164" r="3" fill="#00F0FF" filter="url(#neon-glow)"/>

  <!-- Jawline Geometric Cyber Cut -->
  <path d="M 185 225 L 200 232 L 215 225" fill="none" stroke="rgba(0, 240, 255, 0.5)" stroke-width="1.8"/>

  <!-- Telemetry Overlay Code Badges -->
  <text x="35" y="60" fill="#00F0FF" font-family="monospace" font-size="11" font-weight="bold" opacity="0.85">&lt;AI_ARCHITECT&gt;</text>
  <text x="35" y="76" fill="#A855F7" font-family="monospace" font-size="9" opacity="0.75">SYS_HEALTH: 100%</text>

  <text x="285" y="340" fill="#00F0FF" font-family="monospace" font-size="10" font-weight="bold" opacity="0.85">ID: MORGAN_01</text>
  <text x="285" y="356" fill="#A855F7" font-family="monospace" font-size="9" opacity="0.75">NEURAL_SYNC: OK</text>
</svg>
